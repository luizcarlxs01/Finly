name: finly_mobile
description: "Finly Mobile — espelho do frontend web (apps/web), consumindo a mesma API .NET."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter

  # Estado
  flutter_riverpod: ^2.5.1

  # Navegação
  go_router: ^14.2.0

  # HTTP
  dio: ^5.4.3+1

  # Armazenamento seguro do JWT
  flutter_secure_storage: ^9.2.2

  # Preferências leves (tema)
  shared_preferences: ^2.2.3

  # Formatação / locale
  intl: ^0.19.0

  # IDs para o modo sem conta (espelha crypto.randomUUID() do web)
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
